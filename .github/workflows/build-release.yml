name: Build and Release Docker Image

# 当推送 v* 格式的 tag 时触发自动构建并发布 Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          tags: local-video-swipe:${{ steps.tag.outputs.version }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tar.gz
        run: |
          docker save local-video-swipe:${{ steps.tag.outputs.version }} | gzip > local-video-swipe-amd64.tar.gz
          ls -lh local-video-swipe-amd64.tar.gz

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: local-video-swipe-amd64.tar.gz
